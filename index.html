<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyxOrbit Legal</title>
<meta name="description" content="Terms of Service and Privacy Policy for NyxOrbit.">
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0c14;
    --text: #d3d5e4;
    --head: #f4f1ea;
    --muted: #8c90a8;
    --accent: #ffdb42;
    --rule: #262a3d;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f6f2;
      --text: #26283a;
      --head: #0d0e18;
      --muted: #5d6178;
      --accent: #8a6200;
      --rule: #dcdbe3;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  main { max-width: 42rem; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { margin: 0 0 4px; color: var(--head); font-size: 1.9rem; line-height: 1.2; }
  .date { margin: 0 0 32px; color: var(--muted); font-size: 0.9rem; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 1.2rem; }
  li::marker { color: var(--accent); }
  a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>

<h1>NyxOrbit</h1>
<p class="date">2026-10-08</p>

<p>A free online space game for Windows, made by a small independent team.</p>

<ul>
  <li><a href="terms.html">Terms of Service</a></li>
  <li><a href="privacy.html">Privacy Policy</a></li>
</ul>

<p>Questions: a ticket in #tickets on our Discord, <a href="https://dsc.gg/nyxorbit">dsc.gg/nyxorbit</a>.</p>

</main>
</body>
</html>
